<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --border: #e2e2dd;
    --busy: #2f7de1; --wait: #d9822b; --idle: #3aa36b; --closed: #a3a39e; --accent: #c4643a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #20201e; --fg: #ecebe6; --muted: #9a9a93; --border: #33332f; --closed: #5f5f5a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; }
  h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  #q { flex: 1; max-width: 520px; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font: inherit; }
  #counts { color: var(--muted); font-size: 13px; white-space: nowrap; }
  main { padding: 8px 20px 40px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--closed); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
  .card.busy { border-left-color: var(--busy); }
  .card.idle { border-left-color: var(--idle); }
  .card.wait { border-left-color: var(--wait); }
  .top { display: flex; gap: 8px; align-items: baseline; }
  .title { font-weight: 600; flex: 1; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; color: #fff; background: var(--closed); white-space: nowrap; }
  .busy .badge { background: var(--busy); } .idle .badge { background: var(--idle); } .wait .badge { background: var(--wait); }
  .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .meta a { color: var(--accent); }
  .sum div { margin: 1px 0; } .sum b { color: var(--muted); font-weight: 500; font-size: 12px; }
  .waitwhy { color: var(--wait); font-weight: 600; }
  .prompt { color: var(--muted); font-size: 12px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 6px; margin-top: 3px; }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .stale { opacity: .6; }
  @media (max-width: 600px) { header { flex-wrap: wrap; padding: 12px 16px; } main { padding: 8px 16px 40px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Claude Sessions</h1>
  <input id="q" placeholder="Search titles, summaries, paths, branches…  ( / )" autocomplete="off">
  <span id="counts"></span>
</header>
<main id="main"></main>
<script>
const RECENT_DAYS = 14;
let rows = [];
let showOlder = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const home = p => (p || "").replace(/^\/home\/[^/]+/, "~");

function ago(ts) {
  if (!ts) return "";
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function kind(r) {
  if (!r.live) return "closed";
  if (r.status === "busy") return "busy";
  return r.summary?.waiting_on_user ? "wait" : "idle";
}

function card(r) {
  const k = kind(r), s = r.summary;
  const label = {busy: "working", wait: "needs you", idle: "idle", closed: "closed"}[k];
  const prs = r.prs.map(p => `<a href="${esc(p.url)}" target="_blank">#${p.number}</a>`).join(" ");
  const sum = s ? `<div class="sum ${r.summary_stale ? "stale" : ""}">
      ${k === "wait" && s.waiting_reason ? `<div class="waitwhy">→ ${esc(s.waiting_reason)}</div>` : ""}
      <div><b>goal</b> ${esc(s.goal)}</div>
      <div><b>state</b> ${esc(s.state)}</div>
      ${s.next ? `<div><b>next</b> ${esc(s.next)}</div>` : ""}
    </div>` : `<div class="prompt">${r.summarizing ? "summarizing…" : "no summary yet"}</div>`;
  return `<div class="card ${k}">
    <div class="top"><span class="title">${esc(r.title)}</span><span class="badge">${label}</span></div>
    <div class="meta">${esc(home(r.cwd))}${r.branch && r.branch !== "HEAD" ? ` · ${esc(r.branch)}` : ""} · ${ago(r.last_ts)} ${prs}</div>
    ${sum}
    ${r.last_prompt ? `<div class="prompt" title="${esc(r.last_prompt)}">last prompt: ${esc(r.last_prompt)}</div>` : ""}
    <div class="actions">
      ${r.live ? "" : `<button data-act="resume" data-id="${r.id}" ${r.resume_cwd_exists ? "" : "disabled title='working directory no longer exists'"}>Resume in Terminator</button>`}
      <button data-act="copy" data-id="${r.id}">Copy resume cmd</button>
      <button data-act="summarize" data-id="${r.id}" ${r.summarizing ? "disabled" : ""}>${s ? "Re-summarize" : "Summarize"}</button>
    </div>
  </div>`;
}

function section(title, list) {
  return list.length ? `<h2>${title} (${list.length})</h2><div class="grid">${list.map(card).join("")}</div>` : "";
}

function render() {
  const q = document.getElementById("q").value.toLowerCase().trim();
  const match = r => !q || [r.title, r.cwd, r.branch, r.last_prompt, r.id, r.name, JSON.stringify(r.summary || "")]
    .join(" ").toLowerCase().includes(q);
  const list = rows.filter(match);
  const cutoff = Date.now() - RECENT_DAYS * 86400e3;
  const live = list.filter(r => r.live);
  const closed = list.filter(r => !r.live);
  const recent = closed.filter(r => new Date(r.last_ts) > cutoff);
  const older = closed.filter(r => new Date(r.last_ts) <= cutoff);
  const order = {wait: 0, busy: 1, idle: 2};
  live.sort((a, b) => order[kind(a)] - order[kind(b)]);

  document.getElementById("counts").textContent =
    `${rows.filter(r => kind(r) === "wait").length} need you · ${rows.filter(r => kind(r) === "busy").length} working · ${rows.filter(r => r.live).length} open`;
  document.getElementById("main").innerHTML =
    section("Open", live) + section(`Closed, last ${RECENT_DAYS} days`, recent) +
    (older.length ? (showOlder || q ? section("Older", older)
      : `<h2>Older (${older.length})</h2><button data-act="older">Show older sessions</button>`) : "");
}

async function load() {
  rows = await (await fetch("/api/sessions")).json();
  if (!document.querySelector("button:hover")) render();
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const r = rows.find(r => r.id === b.dataset.id);
  if (b.dataset.act === "older") { showOlder = true; render(); }
  if (b.dataset.act === "copy") { await navigator.clipboard.writeText(r.resume_cmd); b.textContent = "Copied"; }
  if (b.dataset.act === "summarize") { await fetch(`/api/summarize/${r.id}`, {method: "POST"}); r.summarizing = true; render(); }
  if (b.dataset.act === "resume") {
    const res = await (await fetch(`/api/resume/${r.id}`, {method: "POST"})).json();
    b.textContent = res.ok ? "Opened" : res.error;
  }
});
document.getElementById("q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") { e.preventDefault(); document.getElementById("q").focus(); }
});
load();
setInterval(load, 4000);
</script>
</body>
</html>
