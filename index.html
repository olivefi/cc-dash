<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/lib/addon-unicode11.js"></script>
<style>
  :root {
    --bg: #f4f4f1; --panel: #fff; --fg: #1d1d1b; --muted: #6b6b66; --border: #dcdcd6; --hover: #ebebe6;
    --busy: #2f7de1; --wait: #d9822b; --idle: #3aa36b; --closed: #a3a39e; --accent: #c4643a; --star: #e0a800; --peer: #8a63d2;
    --term-bg: #1a1a19;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1c1c1a; --fg: #ecebe6; --muted: #9a9a93; --border: #30302c; --hover: #262624; --closed: #5f5f5a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; display: flex; overflow: hidden; }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; width: 100%; }

  /* sidebar */
  #side { width: 360px; min-width: 260px; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); }
  #side header { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
  #side header .r { display: flex; gap: 8px; align-items: center; }
  #side h1 { font-size: 14px; margin: 0; flex: 1; }
  #counts { color: var(--muted); font-size: 12px; }
  #side header #newform:not(.open) { display: none; }
  #side header button { white-space: nowrap; }
  #favs { display: flex; flex-wrap: wrap; gap: 5px; }
  .fav { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; }
  .fav button { border: none; }
  .fav .x { font-size: 10px; color: var(--muted); padding: 0 6px 0 0; cursor: pointer; display: none; }
  .fav:hover { border-color: var(--accent); } .fav:hover .x { display: inline; }
  #list { overflow-y: auto; flex: 1; padding-bottom: 30px; }
  #list.droptarget { outline: 2px dashed var(--accent); outline-offset: -4px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 12px 4px; }
  .item { padding: 7px 10px 7px 8px; border-left: 3px solid var(--closed); cursor: pointer; border-bottom: 1px solid var(--border); }
  .item:hover { background: var(--hover); }
  .item.open-detail { background: var(--hover); }
  .k-peer { border-left-color: var(--peer); }
  .shr { color: var(--peer); font-size: 12px; }
  .share { display: flex; flex-direction: column; gap: 4px; }
  .share input[data-share-with] { flex: 1; min-width: 140px; width: auto; }
  .share label { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
  .share label input { width: auto; }
  .shareout { font-size: 11px; color: var(--muted); white-space: pre-wrap; }
  .pbody iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .k-busy { border-left-color: var(--busy); } .k-idle { border-left-color: var(--idle); } .k-wait { border-left-color: var(--wait); }
  .row1 { display: flex; gap: 6px; align-items: baseline; }
  .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ago { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .star { border: none; padding: 0 2px; color: var(--muted); font-size: 14px; line-height: 1; }
  .star.on { color: var(--star); }
  .sub { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 20px; }
  .line { margin: 2px 0 0 20px; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line.wait { color: var(--wait); font-weight: 600; }
  .notepv { margin: 3px 0 0 20px; font-size: 12px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { margin: 6px 0 2px 20px; display: flex; flex-direction: column; gap: 6px; cursor: default; }
  .detail b { color: var(--muted); font-weight: 500; font-size: 11px; }
  .detail textarea { min-height: 54px; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 5px; }
  .meta a { color: var(--accent); }

  /* workspace */
  #work { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); background: var(--panel); align-items: flex-end; overflow-x: auto; }
  .tab { padding: 6px 12px; border: 1px solid transparent; border-bottom: none; border-radius: 7px 7px 0 0; cursor: pointer; color: var(--muted); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .tab.active { background: var(--bg); color: var(--fg); border-color: var(--border); margin-bottom: -1px; }
  .tab.droptarget { background: var(--accent); color: #fff; }
  .tab .x { opacity: 0; font-size: 11px; } .tab:hover .x { opacity: .7; } .tab .x.armed { opacity: 1; color: var(--wait); }
  .tab .n { font-size: 11px; color: var(--muted); }
  .tab [contenteditable] { outline: 1px solid var(--accent); padding: 0 3px; }
  #tabs > button { margin: 0 0 4px 4px; }
  #layout { flex: 1; display: flex; min-height: 0; padding: 4px; gap: 0; }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .div-v { width: 6px; cursor: col-resize; flex: none; } .div-h { height: 6px; cursor: row-resize; flex: none; }
  .div-v:hover, .div-h:hover { background: var(--accent); }
  .pane { position: relative; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--term-bg); }
  .phead { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 8px; background: var(--panel); border-bottom: 1px solid var(--border); border-left: 3px solid var(--closed); cursor: grab; }
  .phead .ptitle { flex: 1; font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phead .pwait { color: var(--wait); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .phead button { border: none; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .phead button:hover { color: var(--fg); }
  .pbody { flex: 1; min-height: 0; padding: 2px 0 0 4px; }
  .pbody .xterm { height: 100%; }
  .info { padding: 16px; color: #ecebe6; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; height: 100%; }
  .info b { color: #9a9a93; font-weight: 500; }
  .info button { color: #ecebe6; border-color: #444; }
  .empty { margin: auto; color: var(--muted); text-align: center; border: 2px dashed var(--border); border-radius: 10px; padding: 40px 60px; }
  #layout.droptarget .empty { border-color: var(--accent); color: var(--accent); }
  .drop-overlay { display: none; position: absolute; inset: 0; z-index: 5; }
  body.dragging .drop-overlay { display: block; }
  .drop-overlay[data-zone]::after { content: ""; position: absolute; background: color-mix(in srgb, var(--accent) 35%, transparent); border: 2px solid var(--accent); }
  .drop-overlay[data-zone=left]::after { inset: 0 50% 0 0; } .drop-overlay[data-zone=right]::after { inset: 0 0 0 50%; }
  .drop-overlay[data-zone=top]::after { inset: 0 0 50% 0; } .drop-overlay[data-zone=bottom]::after { inset: 50% 0 0 0; }
  #layout.maxed .col:not(:has(.max)), #layout.maxed .pane:not(.max), #layout.maxed .div-v, #layout.maxed .div-h { display: none; }
  #layout.maxed .col:has(.max), #layout.maxed .pane.max { flex: 1 1 0 !important; }
</style>
</head>
<body>
<aside id="side">
  <header>
    <div class="r"><h1>Claude Sessions</h1><span id="counts"></span><button class="star" data-act="settings" title="Settings">⚙</button></div>
    <div id="settings" hidden><label><input type="checkbox" id="autosum" style="width:auto"> Summarize active sessions automatically (Haiku)</label></div>
    <div class="r"><input id="q" placeholder="Search titles, notes, summaries, paths…" autocomplete="off"><button data-act="newtoggle" title="New session">+ New</button></div>
    <form id="newform" class="r"><input id="newcwd" list="cwds" placeholder="Directory, e.g. ~/ssd2/lunarleaper-isaaclab" autocomplete="off"><button>Start</button><button type="button" data-act="favadd" title="Save as favorite directory">☆</button></form>
    <div id="favs"></div>
    <datalist id="cwds"></datalist>
  </header>
  <div id="list"></div>
</aside>
<section id="work">
  <nav id="tabs"></nav>
  <div id="layout"></div>
</section>
<script>
const RECENT_DAYS = 14;
const $ = s => document.querySelector(s);
let rows = [], byId = {}, state = {groups: [], stars: [], notes: {}};
let cur = null, expanded = null, showOlder = false, drag = null;
let gc = {installed: false, web: ""}, shareMsg = {}, focusId = null;
const panes = new Map();

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const home = p => (p || "").replace(/^\/home\/[^/]+/, "~");
const uid = () => Math.random().toString(36).slice(2, 10);
const HDR = {"content-type": "application/json", "X-CC-Dash": "1"};
const post = (url, body = {}) => fetch(url, {method: "POST", headers: HDR, body: JSON.stringify(body)}).then(r => r.json());

function ago(ts) {
  if (!ts) return "";
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  return `${Math.floor(s / 86400)}d`;
}
function kind(r) {
  if (r?.peer) return "peer";
  if (!r || !r.live) return "closed";
  if (r.status === "busy") return "busy";
  return r.summary?.waiting_on_user ? "wait" : "idle";
}
const starred = id => state.stars.includes(id);

/* ---------- state ---------- */
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => fetch("/api/state", {method: "PUT", headers: HDR, body: JSON.stringify(state)}), 300);
}
const group = (gid = cur) => state.groups.find(g => g.id === gid);
function setCur(gid) {
  if (gid === cur) return;
  cur = gid;
  try { localStorage.setItem("cc-dash-group", gid); } catch {}
  renderTabs(); renderLayout();
}

/* ---------- sidebar ---------- */
const chatUrl = peer => `${gc.web}/#${encodeURIComponent(peer)}`;

function peerItem(r) {
  const open = expanded === r.id, note = state.notes[r.id];
  return `<div class="item k-peer ${open ? "open-detail" : ""}" draggable="true" data-id="${esc(r.id)}">
    <div class="row1"><button class="star ${starred(r.id) ? "on" : ""}" data-act="star">${starred(r.id) ? "★" : "☆"}</button>
      <span class="title">${esc(r.title)}</span><span class="ago">${esc(r.status)}</span></div>
    <div class="sub">${esc(r.cwd)}'s session</div>
    ${note && !open ? `<div class="notepv">✎ ${esc(note.split("\n")[0])}</div>` : ""}
    ${open ? `<div class="detail"><textarea data-note="${esc(r.id)}" placeholder="Notes…">${esc(note || "")}</textarea>
      <div class="actions"><button data-act="addcur">Add chat to “${esc(group()?.name || "")}”</button>
        <a href="${chatUrl(r.peer)}" target="_blank"><button>Open chat in browser</button></a></div></div>` : ""}
  </div>`;
}

function shareBox(r) {
  if (!gc.installed || !(r.live || r.shared)) return "";
  const sh = r.shared;
  return `<div class="share">
    ${sh ? `<div><b>shared with</b> ${esc(sh.acl.join(", "))}${sh.history ? " (with history)" : ""}</div>` : ""}
    ${r.live ? `<div class="actions"><input data-share-with placeholder="share with: jorgen bob, or *" value="${esc(sh?.acl.join(" ") || "")}">
      <label><input type="checkbox" data-share-hist ${sh?.history ? "checked" : ""}>history</label>
      <button data-act="share">${sh ? "Update" : "Share"}</button>${sh ? `<button data-act="unshare">Unshare</button>` : ""}</div>` : ""}
    ${shareMsg[r.id] ? `<div class="shareout">${esc(shareMsg[r.id])}</div>` : ""}
  </div>`;
}

function item(r) {
  if (r.peer) return peerItem(r);
  const k = kind(r), s = r.summary, open = expanded === r.id;
  const line = k === "wait" && s?.waiting_reason ? `<div class="line wait">→ ${esc(s.waiting_reason)}</div>`
    : s ? `<div class="line">${esc(s.state)}</div>` : r.last_prompt ? `<div class="line">${esc(r.last_prompt)}</div>` : "";
  const note = state.notes[r.id];
  const where = r.tmux ? "Open in Terminator" : "Resume in Terminator";
  const detail = open ? `<div class="detail">
      ${s ? `<div><b>goal</b> ${esc(s.goal)}</div><div><b>state</b> ${esc(s.state)}</div>${s.next ? `<div><b>next</b> ${esc(s.next)}</div>` : ""}` : ""}
      <div class="meta"><b>id</b> ${r.id}${r.branch && r.branch !== "HEAD" ? ` · <b>branch</b> ${esc(r.branch)}` : ""}
        ${r.prs.map(p => ` · <a href="${esc(p.url)}" target="_blank">PR #${p.number}</a>`).join("")}</div>
      <textarea data-note="${r.id}" placeholder="Notes…">${esc(note || "")}</textarea>
      ${shareBox(r)}
      <div class="actions">
        <button data-act="addcur">Add to “${esc(group()?.name || "")}”</button>
        ${r.live && !r.tmux ? "" : `<button data-act="terminator" ${r.tmux || r.resume_cwd_exists ? "" : "disabled"}>${where}</button>`}
        ${r.tmux ? `<button data-act="end" title="End this session; resume it any time from the sidebar">End session</button>` : ""}
        <button data-act="copy">Copy cmd</button>
        <button data-act="summarize" ${r.summarizing ? "disabled" : ""}>${s ? "Re-summarize" : "Summarize"}</button>
      </div>
    </div>` : "";
  return `<div class="item k-${k} ${open ? "open-detail" : ""}" draggable="true" data-id="${r.id}">
    <div class="row1"><button class="star ${starred(r.id) ? "on" : ""}" data-act="star">${starred(r.id) ? "★" : "☆"}</button>
      <span class="title">${esc(r.title)}</span>${r.shared ? `<span class="shr" title="shared with ${esc(r.shared.acl.join(", "))}">⇄</span>` : ""}<span class="ago">${r.live ? (r.tmux ? "● " : "◌ ") : ""}${ago(r.last_ts)}</span></div>
    <div class="sub">${esc(home(r.cwd))}${r.branch && r.branch !== "HEAD" ? ` · ${esc(r.branch)}` : ""}</div>
    ${line}${note && !open ? `<div class="notepv">✎ ${esc(note.split("\n")[0])}</div>` : ""}
    ${detail}
  </div>`;
}

function renderSide() {
  const q = $("#q").value.toLowerCase().trim();
  const match = r => !q || [r.title, r.cwd, r.branch, r.last_prompt, r.id, r.peer, state.notes[r.id], JSON.stringify(r.summary || ""), JSON.stringify(r.shared || "")]
    .join(" ").toLowerCase().includes(q);
  const list = rows.filter(match);
  const cutoff = Date.now() - RECENT_DAYS * 86400e3;
  const order = {wait: 0, busy: 1, idle: 2, closed: 3, peer: 3};
  const stars = list.filter(r => starred(r.id)).sort((a, b) => order[kind(a)] - order[kind(b)]);
  const rest = list.filter(r => !starred(r.id));
  const peers = rest.filter(r => r.peer);
  const live = rest.filter(r => r.live && !r.peer).sort((a, b) => order[kind(a)] - order[kind(b)]);
  const closed = rest.filter(r => !r.live);
  const recent = closed.filter(r => r.last_ts && new Date(r.last_ts) > cutoff);
  const older = closed.filter(r => !(r.last_ts && new Date(r.last_ts) > cutoff));
  const sec = (t, l) => l.length ? `<h2>${t} (${l.length})</h2>${l.map(item).join("")}` : "";
  $("#list").innerHTML = sec("★ Starred", stars) + sec("Open", live) + sec("Peers", peers) + sec(`Closed, last ${RECENT_DAYS} days`, recent) +
    (older.length ? (showOlder || q ? sec("Older", older) : `<h2>Older (${older.length})</h2><div style="padding:4px 12px"><button data-act="older">Show older</button></div>`) : "");

  const nWait = rows.filter(r => kind(r) === "wait").length;
  $("#counts").textContent = `${nWait} need you · ${rows.filter(r => kind(r) === "busy").length} working · ${rows.filter(r => r.live && !r.peer).length} open`;
  document.title = nWait ? `(${nWait}) Claude Sessions` : "Claude Sessions";
  $("#cwds").innerHTML = [...new Set(rows.map(r => home(r.resume_cwd)).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join("");
}

/* ---------- tabs ---------- */
function renderTabs() {
  $("#tabs").innerHTML = state.groups.map(g => {
    const n = g.cols.reduce((a, c) => a + c.panes.length, 0);
    const nWait = g.cols.flatMap(c => c.panes).filter(p => kind(byId[p.id]) === "wait").length;
    return `<div class="tab ${g.id === cur ? "active" : ""}" data-gid="${g.id}" title="Double-click to rename">
      <span class="gname">${esc(g.name)}</span><span class="n">${n}${nWait ? ` · <span style="color:var(--wait)">${nWait}!</span>` : ""}</span>
      <span class="x" data-act="delgroup" title="Delete group (sessions keep running)">✕</span></div>`;
  }).join("") + `<button data-act="addgroup" title="New group">+ group</button>`;
}

/* ---------- layout ---------- */
// flex-grow values summing below 1 only fill that fraction of the space, so keep each list's sizes summing to its length
function normalize(list) {
  const sum = list.reduce((a, x) => a + x.size, 0);
  list.forEach(x => x.size = x.size * list.length / sum);
}

function renderLayout() {
  const L = $("#layout"), g = group();
  if (g) { normalize(g.cols); g.cols.forEach(c => normalize(c.panes)); }
  for (const p of panes.values()) p.el.remove();
  L.innerHTML = "";
  L.classList.toggle("maxed", !!g?.max);
  if (!g || !g.cols.length) {
    L.innerHTML = `<div class="empty">Drag sessions here from the sidebar<br><small>drop on a pane's edge to split it</small></div>`;
  } else g.cols.forEach((col, ci) => {
    if (ci) L.append(divider("v", g.cols, ci));
    const c = document.createElement("div");
    c.className = "col";
    c.style.flex = `${col.size} 1 0`;
    col.panes.forEach((pp, pi) => {
      if (pi) c.append(divider("h", col.panes, pi));
      const p = getPane(pp.id);
      p.el.style.flex = `${pp.size} 1 0`;
      p.el.classList.toggle("max", g.max === pp.id);
      c.append(p.el);
    });
    L.append(c);
  });
  const used = new Set(state.groups.flatMap(g => g.cols.flatMap(c => c.panes.map(p => p.id))));
  for (const [id, p] of panes) if (!used.has(id)) { teardown(p); panes.delete(id); }
}

function divider(dir, list, i) {
  const d = document.createElement("div");
  d.className = `div-${dir}`;
  d.onpointerdown = e => {
    d.setPointerCapture(e.pointerId);
    const a = d.previousElementSibling.getBoundingClientRect(), b = d.nextElementSibling.getBoundingClientRect();
    const total = list[i - 1].size + list[i].size;
    const start = dir === "v" ? a.left : a.top, span = dir === "v" ? a.width + b.width : a.height + b.height;
    d.onpointermove = ev => {
      const f = Math.min(.92, Math.max(.08, ((dir === "v" ? ev.clientX : ev.clientY) - start) / span));
      list[i - 1].size = total * f; list[i].size = total * (1 - f);
      d.previousElementSibling.style.flex = `${list[i - 1].size} 1 0`;
      d.nextElementSibling.style.flex = `${list[i].size} 1 0`;
    };
    d.onpointerup = () => { d.onpointermove = null; save(); };
  };
  return d;
}

const inGroup = (g, id) => g.cols.some(c => c.panes.some(p => p.id === id));
function removeFrom(g, id) {
  g.cols.forEach(c => c.panes = c.panes.filter(p => p.id !== id));
  g.cols = g.cols.filter(c => c.panes.length);
  if (g.max === id) g.max = null;
}
function addTo(g, id) {
  if (inGroup(g, id)) return;
  g.max = null;
  if (g.cols.length < 3) return g.cols.push({size: 1, panes: [{id, size: 1}]});
  g.cols.reduce((a, b) => a.panes.length <= b.panes.length ? a : b).panes.push({id, size: 1});
}
function placeAt(g, id, targetId, zone) {
  if (id === targetId) return;
  g.max = null;
  removeFrom(g, id);
  const ci = g.cols.findIndex(c => c.panes.some(p => p.id === targetId));
  if (ci < 0) return addTo(g, id);
  const col = g.cols[ci];
  if (zone === "left" || zone === "right") {
    col.size /= 2;
    g.cols.splice(ci + (zone === "right"), 0, {size: col.size, panes: [{id, size: 1}]});
  } else {
    const pi = col.panes.findIndex(p => p.id === targetId), t = col.panes[pi];
    t.size /= 2;
    col.panes.splice(pi + (zone === "bottom"), 0, {id, size: t.size});
  }
}

/* ---------- panes ---------- */
function getPane(id) {
  if (panes.has(id)) return panes.get(id);
  const el = document.createElement("div");
  el.className = "pane";
  el.dataset.id = id;
  el.innerHTML = `<div class="phead" draggable="true"><button class="star" data-act="star"></button><span class="ptitle"></span><span class="pwait"></span>
    <button data-act="split-bottom" title="New Claude below, same folder (Ctrl+Shift+O)">⊟</button>
    <button data-act="split-right" title="New Claude to the right, same folder (Ctrl+Shift+E)">◫</button>
    <button data-act="max" title="Maximize / restore">⤢</button><button data-act="close" title="Close: ends the session if idle (resume any time), keeps it running if it is working">✕</button></div>
    <div class="pbody"></div><div class="drop-overlay"></div>`;
  const p = {id, el, body: el.querySelector(".pbody"), mode: null};
  panes.set(id, p);
  updatePane(p);
  return p;
}

function paneMode(r, id) {
  if (id.startsWith("peer:")) return "chat";
  if (!r) return "missing";
  if (r.tmux) return "term:" + r.tmux;
  return r.live ? "external" : "closed";
}

function updatePane(p) {
  const r = byId[p.id], k = kind(r);
  const head = p.el.querySelector(".phead");
  head.style.borderLeftColor = `var(--${k})`;
  head.querySelector(".ptitle").textContent = r ? `${r.title} — ${home(r.cwd)}` : p.id;
  head.querySelector(".pwait").textContent = k === "wait" ? `→ ${r.summary.waiting_reason || "needs you"}` : "";
  const st = head.querySelector(".star");
  st.textContent = starred(p.id) ? "★" : "☆";
  st.classList.toggle("on", starred(p.id));
  const mode = paneMode(r, p.id);
  if (mode === p.mode) return;
  teardown(p);
  p.mode = mode;
  if (mode.startsWith("term:")) return attachTerm(p, r.tmux);
  if (mode === "chat") return p.body.innerHTML = `<iframe src="${chatUrl(p.id.slice(5))}"></iframe>`;
  const s = r?.summary;
  p.body.innerHTML = `<div class="info">
    ${s ? `<div><b>goal</b> ${esc(s.goal)}</div><div><b>state</b> ${esc(s.state)}</div>` : ""}
    ${mode === "closed" ? `<div class="actions"><button data-act="resume" ${r.resume_cwd_exists ? "" : "disabled"}>Resume here</button>
        <button data-act="terminator" ${r.resume_cwd_exists ? "" : "disabled"}>Resume in Terminator</button></div>
        ${r.resume_cwd_exists ? "" : `<div>Working directory ${esc(home(r.resume_cwd))} no longer exists.</div>`}` :
      mode === "external" ? `<div>Running in a regular terminal (pid ${r.pid}), so it can't be embedded. Exit it there, then resume it here.</div>` :
      `<div>Session not found.</div>`}
  </div>`;
}

function attachTerm(p, name) {
  const term = new Terminal({
    fontFamily: '"JetBrains Mono", "Fira Code", "DejaVu Sans Mono", ui-monospace, monospace', fontSize: 13,
    allowProposedApi: true, scrollback: 1000, theme: {background: "#1a1a19"},
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = "11";
  p.body.innerHTML = "";
  term.open(p.body);
  const ws = new WebSocket(`ws://${location.host}/ws/term/${name}`);
  ws.binaryType = "arraybuffer";
  const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
  ws.onopen = () => {
    if (p.body.offsetWidth) fit.fit();
    send({r: [term.cols, term.rows]});
    if (focusId === p.id) { term.focus(); focusId = null; }
  };
  ws.onmessage = e => term.write(new Uint8Array(e.data));
  ws.onclose = () => { if (p.term === term) p.mode = null; };
  term.onData(d => send({i: d}));
  term.onResize(({cols, rows}) => send({r: [cols, rows]}));
  term.attachCustomKeyEventHandler(e => {
    if (e.key === "Enter" && e.shiftKey) { if (e.type === "keydown") send({i: "\x1b\r"}); return false; }
    if (e.ctrlKey && e.shiftKey && (e.code === "KeyO" || e.code === "KeyE")) {  // Terminator's split shortcuts
      e.preventDefault();
      if (e.type === "keydown") splitFrom(p.id, e.code === "KeyO" ? "bottom" : "right");
      return false;
    }
    return true;
  });
  const ro = new ResizeObserver(() => { if (p.body.offsetWidth) fit.fit(); });
  ro.observe(p.body);
  Object.assign(p, {term, ws, ro});
}

function teardown(p) {
  if (!p.term) return;
  p.ro.disconnect();
  p.ws.onclose = null;
  p.ws.close();
  p.term.dispose();
  p.term = null;
}

/* ---------- polling ---------- */
async function load() {
  rows = await (await fetch("/api/sessions")).json();
  byId = Object.fromEntries(rows.map(r => [r.id, r]));
  const typing = document.activeElement?.closest?.("#side") && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (!typing && !drag) renderSide();
  if (!drag && !$("#tabs [contenteditable=true]")) renderTabs();
  for (const p of panes.values()) updatePane(p);
}

/* ---------- clicks ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  const id = e.target.closest("[data-id]")?.dataset.id;
  const r = byId[id];
  if (!b) {
    const it = e.target.closest(".item");
    if (it && !e.target.closest(".detail")) { expanded = expanded === id ? null : id; renderSide(); }
    const tab = e.target.closest(".tab");
    if (tab && !tab.querySelector("[contenteditable=true]")) setCur(tab.dataset.gid);
    return;
  }
  const act = b.dataset.act;
  if (act === "star") {
    state.stars = starred(id) ? state.stars.filter(x => x !== id) : [...state.stars, id];
    save(); renderSide(); panes.has(id) && updatePane(panes.get(id));
  }
  if (act === "share" || act === "unshare") {
    const it = b.closest(".item");
    b.disabled = true;
    const res = await post(`/api/share/${id}`, act === "unshare" ? {unshare: true}
      : {with: it.querySelector("[data-share-with]").value, history: it.querySelector("[data-share-hist]").checked});
    shareMsg[id] = res.output;
    await load(); renderSide();
  }
  if (act === "older") { showOlder = true; renderSide(); }
  if (act === "settings") $("#settings").hidden = !$("#settings").hidden;
  if (act === "favnew") startNew(b.dataset.dir);
  if (act === "favdel") { state.favdirs = state.favdirs.filter(d => d !== b.dataset.dir); save(); renderFavs(); }
  if (act === "favadd") {
    const d = $("#newcwd").value.trim();
    if (d && !state.favdirs.includes(d)) { state.favdirs.push(d); save(); renderFavs(); }
  }
  if (act === "newtoggle") { $("#newform").classList.toggle("open"); $("#newcwd").focus(); }
  if (act === "addcur") { addTo(group(), id); save(); renderTabs(); renderLayout(); }
  if (act === "copy") { await navigator.clipboard.writeText(r.resume_cmd); b.textContent = "Copied"; }
  if (act === "summarize") { await post(`/api/summarize/${id}`); b.disabled = true; }
  if (act === "resume" || act === "terminator") {
    b.disabled = true;
    const res = await post(`/api/resume/${id}`, {target: act === "resume" ? "tmux" : "terminator"});
    b.textContent = res.ok ? (act === "resume" ? "Starting…" : "Opened") : res.error;
    load();
  }
  if (act === "close") {
    removeFrom(group(), id);
    save(); renderTabs(); renderLayout();
    const idle = ["idle", "starting"].includes(r?.status);  // busy or running a background shell: keep it alive
    if (r?.tmux && idle && !state.groups.some(g => inGroup(g, id))) { await post(`/api/end/${id}`); load(); }
  }
  if (act === "end") {
    if (r.status === "busy" && !b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Still working, end anyway?"; return; }
    state.groups.forEach(g => removeFrom(g, id));
    save(); renderTabs(); renderLayout();
    await post(`/api/end/${id}`); load();
  }
  if (act === "split-bottom" || act === "split-right") splitFrom(id, act.slice(6));
  if (act === "max") { const g = group(); g.max = g.max === id ? null : id; save(); renderLayout(); }
  if (act === "addgroup") {
    const g = {id: uid(), name: `Group ${state.groups.length + 1}`, cols: []};
    state.groups.push(g); save(); setCur(g.id); renameTab(g.id);
  }
  if (act === "delgroup") {
    e.stopPropagation();
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "delete?"; return; }
    const gid = b.closest(".tab").dataset.gid;
    state.groups = state.groups.filter(g => g.id !== gid);
    if (!state.groups.length) state.groups.push({id: uid(), name: "Main", cols: []});
    save(); if (gid === cur) setCur(state.groups[0].id); else renderTabs();
  }
});

function renameTab(gid) {
  const span = $(`.tab[data-gid="${gid}"] .gname`);
  span.contentEditable = "true";
  span.focus();
  document.getSelection().selectAllChildren(span);
  const done = () => {
    span.contentEditable = "false";
    group(gid).name = span.textContent.trim() || group(gid).name;
    save(); renderTabs();
  };
  span.onblur = done;
  span.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); span.blur(); } };
}
$("#tabs").addEventListener("dblclick", e => { const t = e.target.closest(".tab"); if (t) renameTab(t.dataset.gid); });

document.addEventListener("input", e => {
  const id = e.target.dataset.note;
  if (id === undefined) return;
  if (e.target.value.trim()) state.notes[id] = e.target.value; else delete state.notes[id];
  save();
});
$("#q").addEventListener("input", renderSide);
async function startNew(cwd, nextTo = null, zone = "bottom") {
  const res = await post("/api/new", {cwd});
  if (!res.ok) return alert(res.error);
  $("#newform").classList.remove("open");
  $("#newcwd").value = "";
  if (nextTo) placeAt(group(), res.id, nextTo, zone); else addTo(group(), res.id);
  focusId = res.id;
  save();
  await load(); renderTabs(); renderLayout();
}
function splitFrom(id, zone) {
  const r = byId[id];
  if (r?.cwd && !r.peer) startNew(r.cwd, id, zone);
}
$("#newform").addEventListener("submit", e => { e.preventDefault(); startNew($("#newcwd").value.trim()); });

function renderFavs() {
  $("#favs").innerHTML = state.favdirs.map(d => `<span class="fav">
    <button data-act="favnew" data-dir="${esc(d)}" title="New session in ${esc(d)}">+ ${esc(d === "~" ? "home" : d.split("/").filter(Boolean).pop())}</button>
    <span class="x" data-act="favdel" data-dir="${esc(d)}" title="Remove favorite">✕</span></span>`).join("");
}
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement === document.body) { e.preventDefault(); $("#q").focus(); }
});

/* ---------- drag & drop ---------- */
function zoneOf(e, el) {
  const r = el.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  const d = {left: x, right: 1 - x, top: y, bottom: 1 - y};
  return Object.keys(d).reduce((a, b) => d[a] < d[b] ? a : b);
}
function clearDrop() {
  document.querySelectorAll(".droptarget").forEach(x => x.classList.remove("droptarget"));
  document.querySelectorAll(".drop-overlay[data-zone]").forEach(x => delete x.dataset.zone);
}
document.addEventListener("dragstart", e => {
  const it = e.target.closest?.(".item"), ph = e.target.closest?.(".phead");
  if (!it && !ph) return;
  drag = {id: (it || ph.parentElement).dataset.id, fromPane: !!ph};
  e.dataTransfer.setData("text/plain", drag.id);
  e.dataTransfer.effectAllowed = "move";
  requestAnimationFrame(() => document.body.classList.add("dragging"));
});
document.addEventListener("dragend", () => { drag = null; document.body.classList.remove("dragging"); clearDrop(); });
document.addEventListener("dragover", e => {
  if (!drag) return;
  const ov = e.target.closest(".drop-overlay"), tab = e.target.closest(".tab");
  const L = e.target.closest("#layout"), list = e.target.closest("#list");
  if (!ov && !tab && !L && !(list && drag.fromPane)) return;
  e.preventDefault();
  clearDrop();
  if (ov) ov.dataset.zone = zoneOf(e, ov);
  else (tab || L || list).classList.add("droptarget");
});
document.addEventListener("drop", e => {
  if (!drag) return;
  e.preventDefault();
  const ov = e.target.closest(".drop-overlay"), tab = e.target.closest(".tab");
  const g = group();
  if (tab) {
    const dest = group(tab.dataset.gid);
    if (drag.fromPane && dest !== g) removeFrom(g, drag.id);
    addTo(dest, drag.id);
  } else if (ov) placeAt(g, drag.id, ov.parentElement.dataset.id, ov.dataset.zone || zoneOf(e, ov));
  else if (e.target.closest("#layout")) addTo(g, drag.id);
  else if (e.target.closest("#list") && drag.fromPane) removeFrom(g, drag.id);
  drag = null;
  document.body.classList.remove("dragging");
  clearDrop(); save(); renderTabs(); renderLayout();
});

/* ---------- boot ---------- */
(async () => {
  state = await (await fetch("/api/state")).json();
  gc = await (await fetch("/api/gc")).json();
  if (!state.groups.length) state.groups.push({id: uid(), name: "Main", cols: []});
  state.favdirs ??= ["~", "~/ssd2/lunarleaper-isaaclab", "~/robot-workspaces/lunarleaper-ws/src/lunarleaper-rsl"];
  renderFavs();
  state.settings ??= {auto_summaries: true};
  $("#autosum").checked = state.settings.auto_summaries;
  $("#autosum").onchange = e => { state.settings.auto_summaries = e.target.checked; save(); };
  let saved = null;
  try { saved = localStorage.getItem("cc-dash-group"); } catch {}
  cur = group(saved) ? saved : state.groups[0].id;
  await load();
  renderTabs(); renderLayout();
  setInterval(load, 4000);
})();
</script>
